<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320" viewBox="0 0 850 320"><rect width="850" height="320" fill="#172126"/><g font-family="sans-serif" fill="#edf2f4"><text x="50" y="50" font-size="28">After: offline reconnect timeline</text><text x="50" y="87" font-size="18">One second disconnected; restart immediately when ready</text><rect x="50" y="150" width="148" height="65" fill="#b55e5e"/><rect x="200" y="150" width="148" height="65" fill="#4a9474"/><rect x="350" y="150" width="148" height="65" fill="#4a9474"/><rect x="500" y="150" width="148" height="65" fill="#4a9474"/><rect x="650" y="150" width="148" height="65" fill="#4a9474"/><text x="50" y="245" font-size="18">0s                     1s                     2s                     3s                     4s</text><text x="50" y="290" font-size="15">Restart ready at 1.0 seconds. Excludes renderer startup and physical display timing.</text></g></svg>