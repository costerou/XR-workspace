<!doctype html><html lang="en"><head><meta charset="utf-8"><title>05 Starting, stopping, failed · XR Workspace pre-start mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>
/* Theme tokens: the values Commons.Color / Commons.Style give on this machine (theme colors.toml + shell.toml).
   Swap these seven and the whole mockup follows the theme, as the QML would. */
:root{
  --bg:#000000; --fg:#ffffff; --accent:#8d8d8d; --muted:#7a7a7a;   /* Commons.Color.* */
  --warn:#e7c78a; --err:#e06c75;                                   /* the plugin's own two status colours */
  --radius:0px;                                                    /* Style.cornerRadius (Hyprland rounding) */
  --font:"JetBrainsMono Nerd Font","JetBrains Mono",monospace;     /* Style.font.family */
  --f4:color-mix(in srgb,var(--fg) 4%,transparent);  --f8:color-mix(in srgb,var(--fg) 8%,transparent);
  --f12:color-mix(in srgb,var(--fg) 12%,transparent);--f18:color-mix(in srgb,var(--fg) 18%,transparent);
  --f40:color-mix(in srgb,var(--fg) 40%,transparent);--f65:color-mix(in srgb,var(--fg) 65%,transparent);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#17191c}
body{font:14px/1.5 "Adwaita Sans","Inter",system-ui,sans-serif;color:#d6d9dd;padding:28px 32px 48px;min-width:max-content}
a{color:#9db7ff;text-decoration:none} a:hover{text-decoration:underline}
.top{display:flex;gap:18px;align-items:baseline;margin-bottom:6px;font-size:13px;color:#8b9099}
h1{font-size:22px;font-weight:650;color:#fff;margin-bottom:4px}
.lede{max-width:900px;color:#aab0b8;margin-bottom:24px}
.states{display:grid;grid-template-columns:repeat(var(--cols,3),max-content);gap:34px 30px;align-items:start}
figure{width:520px}
figcaption{margin-bottom:10px}
figcaption b{display:block;color:#fff;font-size:15px;font-weight:650}
figcaption code,.notes code{font:12px var(--font);color:#b9c0c9}
figcaption span{font-size:12.5px;color:#8b9099}
.notes{margin-top:10px;font-size:12.5px;color:#9aa0a8;padding-left:16px}
.notes li{margin-bottom:3px}

/* ---- the panel window: FloatingWindow 520 x 660 (today 700 x 860) ---- */
.win{width:520px;height:660px;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
  border:1px solid var(--accent);border-radius:var(--radius);font:13px/1.45 var(--font);overflow:hidden}
.hd{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 18px;border-bottom:1px solid var(--f12)}
.hd .name{font-size:14px;font-weight:700;letter-spacing:.02em}
.hd .sp{flex:1}
.icon{width:28px;height:28px;display:grid;place-items:center;color:var(--f65)}
.icon svg{width:12px;height:12px}
.back{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 6px;margin-left:-8px;color:var(--f65);font-size:12px}
.back svg{width:10px;height:10px}
.body{flex:1;min-height:0;padding:18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.ft{flex:none;padding:10px 18px;border-top:1px solid var(--f12);font-size:11px;color:var(--muted);display:flex;gap:10px;align-items:center}
.ft .sp{flex:1}
kbd{font:inherit;white-space:nowrap;border:1px solid var(--f40);padding:0 4px;color:var(--f65)}
.grow{flex:1}
.cap{font-size:11px;color:var(--muted)}
.sec{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--f65)}
.h{font-size:16px;font-weight:700}
.big{font-size:24px;font-weight:800;line-height:1.2}
.center{text-align:center}

/* controls: qs.Ui look (hairline border, 4% fill, 28px control height) */
.btn{height:28px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;border:1px solid var(--f40);
  background:var(--f4);border-radius:var(--radius);font-size:12px;white-space:nowrap}
.btn.hover{background:var(--f8)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.btn.off{opacity:.4}
.btn svg{width:10px;height:10px}
.start{height:64px;width:100%;font-size:24px;font-weight:800;letter-spacing:.02em}
.start.off{background:var(--f4);border-color:var(--f18);color:var(--muted);opacity:1}
.dd{height:28px;display:inline-flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 10px;border:1px solid var(--f40);
  background:var(--f4);font-size:12px;min-width:132px}
.dd svg{width:9px;height:9px;color:var(--f65)}
.seg{display:inline-flex}
.seg span{height:28px;display:grid;place-items:center;padding:0 9px;border:1px solid var(--f40);border-left-width:0;background:var(--f4);font-size:12px}
.seg span:first-child{border-left-width:1px}
.seg .on{background:var(--f18);font-weight:700}
.seg .no{color:var(--f40);background:transparent;text-decoration:line-through}
.tg{width:34px;height:18px;border:1px solid var(--f40);background:var(--f4);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--f65)}
.tg.on{background:var(--accent);border-color:var(--accent)} .tg.on::after{left:18px;background:var(--bg)}
.in{height:28px;width:74px;border:1px solid var(--f40);background:var(--f4);display:inline-flex;align-items:center;padding:0 8px;font-size:12px}
.in.bad{border-color:var(--err)}

.card{border:1px solid var(--f18);background:var(--f4);padding:12px 14px;display:flex;align-items:center;gap:14px}
.card .gl{width:40px;height:28px;flex:none;color:var(--fg)} .card.dim .gl{color:var(--f40)}
.card .t{font-size:16px;font-weight:700;line-height:1.25}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--f65);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg)} .dot.w{background:var(--warn)} .dot.m{background:var(--f40)} .dot.e{background:var(--err)}
.rows{border:1px solid var(--f12)}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;padding:5px 12px;border-top:1px solid var(--f12)}
.r:first-child{border-top:0}
.r .k{color:var(--f65);font-size:12px;flex:none}
.r .v{font-size:12px;text-align:right}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:36px}
.set .l{min-width:0}
.set .l .cap{display:block;margin-top:1px}
.note{border-left:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);color:var(--warn);padding:8px 12px;font-size:12px}
.note.err{border-color:var(--err);background:color-mix(in srgb,var(--err) 10%,transparent);color:var(--err)}
.note.q{border-color:var(--f40);background:var(--f4);color:var(--f65)}
.note b{font-weight:700}
.code{border:1px solid var(--f18);background:var(--f4);padding:8px 10px;font-size:11px;color:var(--f65);word-break:break-all}
.hr{height:1px;background:var(--f12);flex:none}

/* desktops preview */
.tight .body{gap:10px}
.prev{height:72px;background:var(--f4);border:1px solid var(--f12);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
.tile{height:50px;border:1px solid var(--f40);background:var(--f8);display:grid;place-items:center;text-align:center;font-size:10px;line-height:1.3;color:var(--f65)}
.tile b{display:block;color:var(--fg);font-size:11px}
.tile.sel{border:2px solid var(--fg);background:var(--f18);color:var(--fg)}
/* slider with named stops */
.sl{position:relative;height:34px;flex:1}
.sl .tr{position:absolute;left:0;right:0;top:8px;height:4px;border-radius:2px;background:var(--f18)}
.sl .fi{position:absolute;left:0;top:8px;height:4px;border-radius:2px;background:var(--accent)}
.sl .kn{position:absolute;top:3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--fg)}
.sl .st{position:absolute;top:20px;font-size:10px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.sl .st.on{color:var(--fg);font-weight:700}
.sl .st:first-of-type{transform:none} .sl .st.last{transform:translateX(-100%)}
/* consent */
.scope{display:grid;grid-template-columns:86px 1fr;gap:9px 12px;font-size:12px;line-height:1.4}
.scope dt{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--f65);padding-top:2px}
.scope dd p+p{margin-top:5px}
.scope .opt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.scope .opt .tg{margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}
.chip{border:1px solid var(--f18);padding:1px 6px;font-size:11px;color:var(--f65)}
.acts{display:flex;gap:8px;align-items:center}
/* progress */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.step .m{width:16px;height:16px;flex:none;margin-top:1px;border:1px solid var(--f40);display:grid;place-items:center}
.step.done .m{background:var(--f18);border-color:var(--f18)} .step.done .m svg{width:9px;height:9px}
.step.now .m{border-color:var(--fg)} .step.now .m::after{content:"";width:6px;height:6px;background:var(--fg)}
.step.todo{color:var(--f40)}
.step .cap{display:block}
.bar{height:3px;background:var(--f12);position:relative;flex:none} .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
/* bar widget */
.shellbar{width:1100px;height:26px;background:var(--bg);color:var(--fg);display:flex;align-items:center;font:12px var(--font);padding:0 10px;gap:14px}
.shellbar .sp{flex:1}
.shellbar .ws{display:flex;gap:10px;color:var(--f65)} .shellbar .ws b{color:var(--fg)}
.shellbar .w{width:28px;height:26px;display:grid;place-items:center;position:relative}
.shellbar .w svg{height:13px;width:19px}
.shellbar .w.hl{background:var(--f8)}
.shellbar .w i{position:absolute;top:5px;right:1px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.gly{width:13px;height:13px;border:1.5px solid var(--f65)}
.gly.c{border-radius:50%}
.tip{display:inline-block;background:var(--bg);border:1px solid var(--fg);color:var(--fg);font:12px var(--font);padding:5px 9px}
.menu{display:inline-block;background:var(--bg);border:1px solid var(--accent);font:12px var(--font);color:var(--fg);padding:4px;min-width:170px}
.menu div{height:28px;display:flex;align-items:center;padding:0 10px} .menu div.hl{background:var(--f8)}
.barfig{width:auto}
.barrow{display:flex;gap:26px;align-items:flex-start;margin-top:10px}
.zoom{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}
.zoom .z{background:var(--bg);border:1px solid #333;padding:14px 18px;text-align:center;color:#aab0b8;font-size:12px;width:250px}
.zoom .z .w{width:84px;height:78px;margin:0 auto 8px;display:grid;place-items:center;position:relative}
.zoom .z .w svg{width:57px;height:40px}
.zoom .z .w i{position:absolute;top:14px;right:6px;width:13px;height:13px;border-radius:50%;background:var(--warn)}
.zoom .z b{display:block;color:#fff;font-weight:600}
</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true">

<h1>05 · Starting, stopping, failed</h1><p class="lede">What the panel shows between Confirm and the session, and on the way back out. Today each of these is one sentence and one button on an otherwise empty 700×860 window.</p>
<div class="states" style="--cols:4"><figure><figcaption><b>Starting</b><span><code>state: starting</code></span></figcaption><div class="win"><div class="hd"><svg width="24" height="24"><use href="#emblem"/></svg><span class="name">XR Workspace</span><span class="sp"></span><span class="icon" title="Close (Esc)"><svg class=""><use href="#x"/></svg></span></div><div class="body"><div class="card"><svg class="gl"><use href="#glasses"/></svg><div class="grow"><div class="t">Luma Ultra</div><div class="cap">Connected on DP-2</div></div><span class="pill"><span class="dot w"></span>Starting</span></div><div><div class="big">Starting XR…</div><div class="cap">Put the glasses on. Your windows move when the desktops are ready.</div></div><div class="bar"><i style="width:55%"></i></div><div class="steps"><div class="step done"><span class="m"><svg class=""><use href="#ok"/></svg></span><div>Checking the installed files</div></div><div class="step done"><span class="m"><svg class=""><use href="#ok"/></svg></span><div>Loading the session plugin</div></div><div class="step now"><span class="m"></span><div>Calibrating head tracking<span class="cap">Keep the glasses still. Up to 30 seconds.</span></div></div><div class="step todo"><span class="m"></span><div>Creating XR desktops and moving windows</div></div><div class="step todo"><span class="m"></span><div>Starting the picture in the glasses</div></div></div><div class="grow"></div><div class="acts"><span class="btn">Cancel start</span><span class="cap">Stops here and puts your windows back.</span></div></div></div><ul class='notes'><li><b>Needs one controller change:</b> the runner already reports <code>verify → plugin → tracking</code> to its <code>progress</code> callback, but the snapshot does not carry it. Without that field, drop the step list and keep the heading, the indeterminate bar and Cancel.</li><li>“Cancel / stop session” becomes “Cancel start” here (<code>op: stop</code>, unchanged).</li></ul></figure><figure><figcaption><b>Stopping</b><span><code>state: stopping</code></span></figcaption><div class="win"><div class="hd"><svg width="24" height="24"><use href="#emblem"/></svg><span class="name">XR Workspace</span><span class="sp"></span><span class="icon" title="Close (Esc)"><svg class=""><use href="#x"/></svg></span></div><div class="body"><div class="card"><svg class="gl"><use href="#glasses"/></svg><div class="grow"><div class="t">Luma Ultra</div><div class="cap">Connected on DP-2</div></div><span class="pill"><span class="dot w"></span>Stopping</span></div><div><div class="big">Stopping XR…</div><div class="cap">Moving your windows back to DP-1 and removing the XR desktops.</div></div><div class="bar"><i style="width:35%"></i></div><div class="grow"></div><div class="cap">No action needed. This page returns to Start when it is done.</div></div></div><ul class='notes'><li>Today: “Stopping session…”. Now it says where the windows are going.</li></ul></figure><figure><figcaption><b>Session failed</b><span><code>state: failed</code>, <code>run_id</code> set</span></figcaption><div class="win"><div class="hd"><svg width="24" height="24"><use href="#emblem"/></svg><span class="name">XR Workspace</span><span class="sp"></span><span class="icon" title="Close (Esc)"><svg class=""><use href="#x"/></svg></span></div><div class="body"><div class="card"><svg class="gl"><use href="#glasses"/></svg><div class="grow"><div class="t">Luma Ultra</div><div class="cap">Connected on DP-2</div></div><span class="pill"><span class="dot e"></span>Failed</span></div><div><div class="big">XR did not start</div><div class="cap">Nothing is running in the glasses.</div></div><div class="note err"><b>What happened</b><br>Head tracking did not calibrate in 30 seconds. XR was not started and your windows stayed where they are.</div><div class="acts"><span class="btn primary">Clean up and go back</span></div><div class="cap">Removes anything this attempt left behind, then returns to Start.</div><div class="grow"></div></div><div class="ft"><span>Details: journalctl --user -u viture-workspace-controller</span></div></div><ul class='notes'><li>Today: amber reason at the top of the window, “Session failed”, and a button still labelled “Cancel / stop session”.</li><li>Button is the same <code>op: stop</code>; shown only when <code>run_id</code> is set, as now.</li></ul></figure><figure><figcaption><b>A request was refused</b><span><code>reply.ok: false</code> on any page</span></figcaption><div class="win"><div class="hd"><svg width="24" height="24"><use href="#emblem"/></svg><span class="name">XR Workspace</span><span class="sp"></span><span class="icon" title="Close (Esc)"><svg class=""><use href="#x"/></svg></span></div><div class="body"><div class="card"><svg class="gl"><use href="#glasses"/></svg><div class="grow"><div class="t">Luma Ultra</div><div class="cap">Connected on DP-2</div></div><span class="pill"><span class="dot "></span>Ready</span></div><div class="btn primary start">Start XR</div><div class="note err"><div class="set" style="min-height:0;align-items:flex-start"><div class="l"><b>That did not work</b><br>busy</div><span class="icon" style="margin:-6px -8px 0 0;color:var(--err)"><svg class=""><use href="#x"/></svg></span></div></div><div class="grow"></div><div class="acts"><span class="sec grow">This session</span><span class="btn">Session setup <svg class=""><use href="#gt"/></svg></span></div><div class="rows"><div class="r"><span class="k">Desktops</span><span class="v">3 · 1920×1080 · 100%</span></div><div class="r"><span class="k">Head tracking</span><span class="v">On · XR Luma driver</span></div><div class="r"><span class="k">Refresh rate</span><span class="v">120 Hz for this session</span></div><div class="r"><span class="k">Windows return to</span><span class="v">DP-1</span></div><div class="r"><span class="k">Stabilization</span><span class="v">Light · 25%</span></div></div></div><div class="ft"><span>Everything else is set in the glasses. <kbd>Ctrl+Alt+H</kbd> there lists the keys.</span></div></div><ul class='notes'><li>The controller's refusal text (<code>reply.error</code>, e.g. “busy”, “Request refused”) appears in one dismissible block under the control that caused it, on whichever page is open.</li><li>Today it replaces the reason line at the very top of the window, in the same amber as everything else.</li></ul></figure></div></body></html>
