# cargo deny check licenses bans sources
# Our own crates are publish = false and carry no licence yet; only third-party crates are checked.

[graph]
all-features = true

[licenses]
# Permissive licences only. Anything else needs a deliberate decision recorded here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# The list is policy, not an inventory: entries no crate uses yet are fine.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
