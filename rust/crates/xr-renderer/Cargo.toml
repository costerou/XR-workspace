[package]
name = "xr-renderer"
description = "XR renderer on GLES and Wayland."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
drm-fourcc = { version = "2", default-features = false }
gbm = { version = "0.18.0", default-features = false }
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["event", "fs", "mm", "net", "process", "time"] }
serde = "1.0.229"
serde_json = "1.0.154"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xr-wire = { path = "../xr-wire" }

[[test]]
name = "video_render"
harness = false

[[test]]
name = "gl_frame"
harness = false

[[test]]
name = "gl_parity"
harness = false

[[test]]
name = "glass_render"
harness = false

[[test]]
name = "overlay_residue"
harness = false

[[test]]
name = "pill_border_render"
harness = false

[[test]]
name = "stereo_render"
harness = false

[[test]]
name = "depth_link_render"
harness = false

[[bench]]
name = "gl_bench"
harness = false
