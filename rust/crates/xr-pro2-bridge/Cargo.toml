[package]
name = "xr-pro2-bridge"
description = "Pro 2 bridge host around the VITURE SDK, loaded through FFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
libc = "0.2"
libloading = "0.8"
sha2 = "0.11"
xr-pose = { version = "0.0.0", path = "../xr-pose" }

[features]
# --fixture-root and --fixture-hash, for the QA suites against tests/pro2_runtime_qa/sdk_fixture.c.
# Never in a shipped build: without it those flags are unknown arguments (exit 2).
synthetic = []
