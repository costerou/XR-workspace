[package]
name = "xr-workspace"
description = "Controller, supervisor, key helper and installer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "xr-workspace"
path = "src/main.rs"

# The bind helper: one process per bound key press, so it is its own small binary.
[[bin]]
name = "xr-control"
path = "src/bin/xr-control.rs"

[lints]
workspace = true

[dependencies]
# Sockets with a timed connect, SO_PEERCRED, getuid and access(2) in the key helper: the calls std does not expose.
libc = "0.2"
rustix = { version = "1", features = ["fs", "process", "rand"] }
# The incident monitor's regex rules (the scrubber, kernel and journal lines).
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
xkbcommon = { version = "0.9", default-features = false }
xr-wire = { path = "../xr-wire" }

[dev-dependencies]
# preserve_order: the incident reports keep Python's dict order, so the corpus tests compare byte for byte.
# It stays a test-only feature: as a normal dependency it would unify into the renderer's serde_json and
# change its output in workspace builds. The monitor turns it on (or writes in a fixed order) once it is live.
serde_json = { version = "1", features = ["preserve_order"] }
